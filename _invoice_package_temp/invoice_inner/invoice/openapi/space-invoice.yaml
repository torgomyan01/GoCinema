openapi: "3.0.0"
info:
  version: "1.0.0"
  title: "Invoicing"
servers:
  - url: "http://localhost:8080"
    description: Local
paths:
  /invoice/invoice-issue:
    post:
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  properties:
                    clientTin:
                      type: string
                      nullable: true
                    clientUser:
                      type: string
                      nullable: true
                    requestId:
                      type: string
                      format: uuid
                    signedAt:
                      type: string
                      format: date-time
                    cn:
                      type: string
                    signer:
                      type: string
                    idSerialNoList:
                      type: object
      responses:
        "200":
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  payload:
                    type: object
                    nullable: true
                  failure:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /invoice/invoice-approve:
    post:
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  properties:
                    clientTin:
                      type: string
                      nullable: true
                    clientUser:
                      type: string
                      nullable: true
                    requestId:
                      type: string
                      format: uuid
                    signedAt:
                      type: string
                      format: date-time
                    cn:
                      type: string
                    signer:
                      type: string
                    ids:
                      type: string
                      format: uuid
      responses:
        "200":
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  payload:
                    type: object
                    nullable: true
                  failure:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
